name: Task Tracker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: CI Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: devops
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: task_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devops -d task_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Test database migrations
        env:
          MIGRATION_DATABASE_URL: postgresql://devops:test123@localhost:5432/task_test
        run: |
          npm run migrate
          npm run migrate  

      - name: Build Docker image
        run: docker build -t devops-task-tracker:ci .

  publish:
    name: Publish Docker Image
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-task-tracker:latest
